[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baghban"
version = "0.2.1"
description = "Check, draw and compare Bonsai workflows on any machine, before the rig runs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aslan Satary Dizaji" }]
keywords = ["bonsai", "bonsai-rx", "neuroscience", "experiments", "lint", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
provenance = ["daftar"]

[project.scripts]
baghban = "baghban.cli:main"

[project.urls]
Homepage = "https://github.com/aslansd/baghban"
Issues = "https://github.com/aslansd/baghban/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
